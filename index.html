<style>
:root{
  --azul:#1e3a5f; --azul-esc:#152a46; --dourado:#c9a227; --dourado-claro:#f3e7c3;
  --fundo:#f6f4ef; --card:#ffffff; --texto:#2b2b2b; --cinza:#6b7280; --verde:#2e7d32; --vermelho:#b3261e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,'Times New Roman',serif;background:var(--fundo);color:var(--texto);line-height:1.55}
header{background:var(--azul);color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-size:1.25rem;font-weight:600}

.layout{display:flex;min-height:calc(100vh - 64px)}
nav{width:280px;background:var(--azul-esc);color:#e8e8e8;padding:16px 0;flex-shrink:0}
nav .grupo{padding:10px 20px 4px;font-family:Arial,sans-serif;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dourado)}
nav button.item{display:block;width:100%;text-align:left;background:none;border:none;color:#dcdcdc;padding:9px 20px;font-size:.92rem;cursor:pointer;font-family:Georgia,serif;border-left:3px solid transparent}
nav button.item:hover{background:rgba(255,255,255,.06)}
nav button.item.ativo{background:rgba(201,162,39,.15);border-left-color:var(--dourado);color:#fff}
nav button.item .feito{color:var(--dourado);font-size:.8rem;margin-left:6px}
main{flex:1;padding:28px 34px;max-width:980px}
.abas{display:flex;gap:8px;margin:18px 0 22px;font-family:Arial,sans-serif}
.abas button{padding:9px 22px;border:1px solid var(--azul);background:#fff;color:var(--azul);border-radius:20px;cursor:pointer;font-size:.88rem}
.abas button.ativa{background:var(--azul);color:#fff}
.card{background:var(--card);border:1px solid #e3ded2;border-radius:10px;padding:22px 26px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
h2.titulo-peca{color:var(--azul);font-size:1.5rem;margin-bottom:2px}
.badge{display:inline-block;font-family:Arial,sans-serif;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;background:var(--dourado-claro);color:#7a5c00;border-radius:12px;padding:3px 12px;margin-bottom:10px}

.ficha .f{background:#faf8f2;border:1px solid #eee4c8;border-radius:8px;padding:12px 14px}

.envio-opcao:hover{border-color:var(--dourado);background:#fffdf7}.envio-opcao b{display:block}.envio-opcao small{display:block;color:var(--cinza);font-size:.73rem;margin-top:2px}
.parecer-inicial{background:#f4f7fb;border:1px solid #cdd8e6;border-left:4px solid var(--azul);border-radius:8px;padding:18px 20px;margin-top:14px}
.parecer-inicial h2,.parecer-inicial h3,.parecer-inicial h4{color:var(--azul);margin:12px 0 5px}.parecer-inicial h2:first-child,.parecer-inicial h3:first-child{margin-top:0}
.parecer-inicial ul{margin:5px 0 10px 20px}.parecer-inicial a{color:var(--azul);word-break:break-all}
.pbar{margin-top:12px;font-family:Arial,sans-serif}

.spinner{display:inline-block;width:16px;height:16px;border:3px solid #d4dce8;border-top-color:var(--azul);border-radius:50%;animation:gira .8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes gira{to{transform:rotate(360deg)}}
.campo-chave{width:100%;padding:9px 12px;border:1px solid #cfc9b8;border-radius:6px;font-family:Arial,sans-serif;font-size:.85rem;margin-top:8px}
.erro-ia{color:var(--vermelho);font-size:.88rem;margin-top:10px;font-family:Arial,sans-serif}
.loginwrap{max-width:420px;margin:60px auto;background:#fff;border:1px solid #e3ded2;border-radius:12px;padding:30px 34px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.loginwrap h2{color:var(--azul);margin-bottom:6px}
.loginwrap p{font-size:.9rem;color:var(--cinza);margin-bottom:14px}
.loginwrap input{width:100%;padding:11px 13px;border:1px solid #cfc9b8;border-radius:6px;font-family:Arial,sans-serif;font-size:.95rem;margin-bottom:10px}
.loginwrap button{width:100%;padding:11px;border:none;border-radius:6px;background:var(--azul);color:#fff;font-size:.95rem;cursor:pointer;font-family:Arial,sans-serif}
.loginwrap .erro-ia{margin-top:8px}
.userbar{font-family:Arial,sans-serif;font-size:.8rem;color:var(--dourado-claro);display:flex;align-items:center;gap:10px}
.userbar a{color:#fff;cursor:pointer;text-decoration:underline}
.btn-sair{background:#a33;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:.8rem;cursor:pointer;font-family:Arial,sans-serif;white-space:nowrap}
.btn-sair:hover{background:#c44}
.versao-aviso{position:fixed;z-index:10000;left:50%;bottom:18px;transform:translateX(-50%);width:min(680px,calc(100% - 28px));display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--azul-esc);color:#fff;border:1px solid var(--dourado);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.3);font: .86rem Arial,sans-serif}
.versao-aviso button{flex-shrink:0;border:0;border-radius:6px;padding:9px 14px;background:var(--dourado);color:#17243a;font-weight:700;cursor:pointer}
.senha-overlay{position:fixed;inset:0;z-index:9999;background:rgba(10,24,43,.68);display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif}
.senha-modal{width:min(480px,100%);background:#fff;border-radius:12px;padding:24px;box-shadow:0 16px 48px rgba(0,0,0,.28)}
.senha-modal h3{color:var(--azul);margin-bottom:8px}
.senha-modal p{color:var(--cinza);font-size:.88rem;margin-bottom:14px}
.senha-modal input{width:100%;padding:12px;border:1px solid #cfc9b8;border-radius:7px;background:#faf8f2;color:var(--texto);font:600 1.05rem monospace;letter-spacing:.03em}
.senha-modal .acoes{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.senha-modal button{padding:10px 16px;border:1px solid var(--azul);border-radius:6px;background:#fff;color:var(--azul);font-weight:600;cursor:pointer}
.senha-modal button.primario{background:var(--azul);color:#fff}
.senha-modal .status{min-height:20px;margin:8px 0 0;color:var(--verde);font-size:.82rem}
.painel table{width:100%;border-collapse:collapse;font-size:.88rem;font-family:Arial,sans-serif;margin-top:10px}
.painel th,.painel td{border-bottom:1px solid #eee;padding:7px 8px;text-align:left}
.md-tab{width:100%;border-collapse:collapse;font-size:.86rem;font-family:Arial,sans-serif;margin:10px 0;background:#fff}
.md-tab td,.md-tab th{border:1px solid #d8d2c0;padding:6px 9px;text-align:left;vertical-align:top}
.md-tab tr:first-child td{background:#f2eee0;font-weight:bold}
.md-tab tr:last-child td{background:#eef5ee;font-weight:bold}
.painel textarea{width:100%;min-height:140px;padding:10px;border:1px solid #cfc9b8;border-radius:6px;font-family:monospace}
.metricas{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:14px 0 18px}
.metrica{background:#fff;border:1px solid #e3ded2;border-radius:9px;padding:14px 16px;font-family:Arial,sans-serif}
.metrica b{display:block;color:var(--azul);font-size:1.45rem;line-height:1.2}.metrica span{color:var(--cinza);font-size:.78rem}
.barra-ind{height:9px;background:#e8e4d8;border-radius:6px;overflow:hidden;min-width:110px}.barra-ind span{display:block;height:100%;background:var(--azul);border-radius:6px}
.campo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:10px;font-family:Arial,sans-serif}
.campo-grid label{font-size:.8rem;color:var(--cinza)}.campo-grid input{display:block;width:100%;margin-top:4px;padding:8px;border:1px solid #cfc9b8;border-radius:6px;font-family:Arial,sans-serif}
@media(max-width:820px){.layout{flex-direction:column}nav{width:100%;display:flex;flex-wrap:wrap}nav .grupo{width:100%}nav button.item{width:auto;border-left:none}main{padding:18px}}
</style>
</head>
<body>
<header>
  <div>
    <h1 onclick="irInicio()" style="cursor:pointer" title="Voltar ao início">⚖️ Laboratório de Peças Penais</h1>
    <div class="sub">Estágio I e II · NPJ/IESB · Prof. Me. Rodrigo Silva Pereira</div>
  </div>
  <div class="sub" id="progresso"></div>
</header>
<div class="layout">
  <nav id="menu"></nav>
  <main id="conteudo"></main>
</div>
<script>
// ================= Helpers =================
const APP_VERSION='__APP_VERSION__';
let store={};
function sget(k,d){try{return localStorage.getItem(k)??d}catch(e){return store[k]??d}}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){store[k]=v}}
// A autenticação é deliberadamente limitada à aba/janela atual. Rascunhos
// continuam no armazenamento local, mas os dados da sessão não sobrevivem ao
// fechamento da janela e nunca incluem o token HttpOnly.
function aget(){try{return sessionStorage.getItem('auth')||''}catch(e){return store.auth||''}}
function aset(v){try{if(v)sessionStorage.setItem('auth',v);else sessionStorage.removeItem('auth');localStorage.removeItem('auth')}catch(e){store.auth=v||''}}
let avisoNovaVersaoExibido=false;
function mostrarAvisoNovaVersao(){
  if(avisoNovaVersaoExibido)return;avisoNovaVersaoExibido=true;
  const aviso=document.createElement('div');aviso.className='versao-aviso';aviso.setAttribute('role','status');
  const texto=document.createElement('span');texto.textContent='Há uma atualização do sistema disponível. Atualize para ver os recursos e valores mais recentes.';
  const botao=document.createElement('button');botao.type='button';botao.textContent='Atualizar agora';botao.onclick=()=>location.reload();
  aviso.append(texto,botao);document.body.appendChild(aviso);
}
async function verificarNovaVersao(){
  try{const r=await fetch('/api/versao?agora='+Date.now(),{cache:'no-store',credentials:'same-origin'});if(!r.ok)return;const d=await r.json();if(d.versao&&d.versao!==APP_VERSION)mostrarAvisoNovaVersao()}catch(e){}
}
setTimeout(verificarNovaVersao,3000);
setInterval(verificarNovaVersao,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)verificarNovaVersao()});
const menu=document.getElementById('menu'),conteudo=document.getElementById('conteudo');
let AUTH=null; try{localStorage.removeItem('auth');AUTH=JSON.parse(aget()||'null')}catch(e){AUTH=null}
let MODO_VISAO=sget('modo_visao','');
let TURMA_ATUACAO=sget('turma_atuacao','');
let TURMAS_ATUACAO=[];
function professorEmVisaoAluno(){return !!(AUTH&&AUTH.tipo==='professor'&&MODO_VISAO==='aluno');}
function aplicarCabecalhosVisao(h){
  if(professorEmVisaoAluno()){
    h['x-modo-atuacao']='aluno';
    if(TURMA_ATUACAO)h['x-turma-atuacao']=TURMA_ATUACAO;
  }
}
async function apiPost(u,b){
  const h={'content-type':'application/json'};
  aplicarCabecalhosVisao(h);
  const r=await fetch(u,{method:'POST',headers:h,credentials:'same-origin',body:JSON.stringify(b)});
  if(r.status===401){let d=null;try{d=await r.clone().json()}catch(e){}
    if(d&&d.erro==='SESSAO'){sair('Sua sessão expirou. Entre novamente.');throw new Error('sessao')}}
  if(r.status===403){let d=null;try{d=await r.clone().json()}catch(e){}
    if(d&&d.erro==='TROCAR_SENHA'&&AUTH){AUTH.precisaTrocarSenha=true;aset(JSON.stringify(AUTH));renderTroca();throw new Error('trocar_senha')}
    if(d&&d.erro==='COMPLETAR_CADASTRO'&&AUTH){AUTH.precisaCompletarCadastro=true;aset(JSON.stringify(AUTH));renderTroca();throw new Error('completar_cadastro')}
    if(d&&d.erro==='VERIFICAR_EMAIL'&&AUTH){AUTH.emailVerificado=false;aset(JSON.stringify(AUTH));renderVerificarEmail();throw new Error('verificar_email')}
    if(d&&d.erro==='ACEITAR_PRIVACIDADE'&&AUTH){AUTH.precisaAceitarPrivacidade=true;aset(JSON.stringify(AUTH));renderPrivacidade();throw new Error('privacidade')}}
  return r;
}
async function apiGet(u){
  const h={};
  aplicarCabecalhosVisao(h);
  const r=await fetch(u,{headers:h,credentials:'same-origin'});
  if(r.status===401){let d=null;try{d=await r.clone().json()}catch(e){}
    if(d&&d.erro==='SESSAO'){sair('Sua sessão expirou. Entre novamente.');throw new Error('sessao')}}
  if(r.status===403){let d=null;try{d=await r.clone().json()}catch(e){}
    if(d&&d.erro==='TROCAR_SENHA'&&AUTH){AUTH.precisaTrocarSenha=true;aset(JSON.stringify(AUTH));renderTroca();throw new Error('trocar_senha')}
    if(d&&d.erro==='COMPLETAR_CADASTRO'&&AUTH){AUTH.precisaCompletarCadastro=true;aset(JSON.stringify(AUTH));renderTroca();throw new Error('completar_cadastro')}
    if(d&&d.erro==='VERIFICAR_EMAIL'&&AUTH){AUTH.emailVerificado=false;aset(JSON.stringify(AUTH));renderVerificarEmail();throw new Error('verificar_email')}
    if(d&&d.erro==='ACEITAR_PRIVACIDADE'&&AUTH){AUTH.precisaAceitarPrivacidade=true;aset(JSON.stringify(AUTH));renderPrivacidade();throw new Error('privacidade')}}
  return r;
}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escAttr(t){return esc(t).replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function mostrarSenhaTemporaria(titulo,senha){
  const anterior=document.getElementById('senha_modal');if(anterior)anterior.remove();
  const overlay=document.createElement('div');overlay.id='senha_modal';overlay.className='senha-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-labelledby','senha_modal_titulo');
  const modal=document.createElement('div');modal.className='senha-modal';
  const h=document.createElement('h3');h.id='senha_modal_titulo';h.textContent=titulo;
  const aviso=document.createElement('p');aviso.textContent='Copie agora: esta senha não será exibida novamente depois que a janela for fechada.';
  const campo=document.createElement('input');campo.type='text';campo.readOnly=true;campo.value=String(senha||'');campo.setAttribute('aria-label','Senha temporária');campo.autocomplete='off';campo.spellcheck=false;
  const status=document.createElement('div');status.className='status';status.setAttribute('aria-live','polite');
  const acoes=document.createElement('div');acoes.className='acoes';
  const copiar=document.createElement('button');copiar.type='button';copiar.className='primario';copiar.textContent='📋 Copiar senha';
  const fechar=document.createElement('button');fechar.type='button';fechar.textContent='Fechar';
  const encerrar=()=>{document.removeEventListener('keydown',tecla);overlay.remove()};
  const tecla=e=>{if(e.key==='Escape')encerrar()};
  copiar.onclick=async()=>{
    let copiou=false;
    try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(campo.value);copiou=true}}catch(e){}
    if(!copiou){try{campo.focus();campo.select();copiou=document.execCommand('copy')}catch(e){}}
    if(copiou){copiar.textContent='✓ Senha copiada';status.textContent='Senha copiada para a área de transferência.'}
    else{campo.focus();campo.select();status.textContent='Não foi possível copiar automaticamente. A senha foi selecionada; use Ctrl+C.'}
  };
  fechar.onclick=encerrar;overlay.onclick=e=>{if(e.target===overlay)encerrar()};campo.onclick=()=>campo.select();
  acoes.append(copiar,fechar);modal.append(h,aviso,campo,status,acoes);overlay.append(modal);document.body.append(overlay);document.addEventListener('keydown',tecla);campo.focus();campo.select();
}
function md2html(t){
  t=esc(t);
  t=t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  t=t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<i>$2</i>');
  t=t.replace(/\[([^\]]+)\]\((https?:[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  t=t.replace(/(^|[^"=>])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  const linhas=t.split('\n');let out='',lista=false,tabela=false;
  for(let l of linhas){const s2=l.trim();
    if(/^\|.*\|$/.test(s2)){
      if(lista){out+='</ul>';lista=false}
      if(/^\|[\s:|\-]+\|$/.test(s2))continue; // linha separadora |---|---|
      if(!tabela){out+='<table class="md-tab">';tabela=true}
      out+='<tr>'+s2.slice(1,-1).split('|').map(function(c){return '<td>'+c.trim()+'</td>'}).join('')+'</tr>';continue}
    if(tabela){out+='</table>';tabela=false}
    if(/^#{1,4}\s/.test(s2)){if(lista){out+='</ul>';lista=false}out+='<h4>'+s2.replace(/^#{1,4}\s*/,'')+'</h4>';continue}
    if(/^NOTA SUGERIDA/i.test(s2)){if(lista){out+='</ul>';lista=false}out+='<div class="nota">'+s2+'</div>';continue}
    if(/^[-•*]\s/.test(s2)){if(!lista){out+='<ul>';lista=true}out+='<li>'+s2.replace(/^[-•*]\s*/,'')+'</li>';continue}
    if(s2===''){if(lista){out+='</ul>';lista=false}continue}
    if(lista){out+='</ul>';lista=false}out+='<p>'+s2+'</p>';}
  if(lista)out+='</ul>';if(tabela)out+='</table>';return out;
}

}

async function publicarRascunho(id){
  const p=window.__peca;if(!p)return;
  const turmaId=(document.getElementById('vt_turma')||{}).value;
  const prazo=(document.getElementById('vt_prazo')||{}).value;
  const fb=document.getElementById('vt_fb');
  if(!turmaId){fb.innerHTML='<p class="erro-ia">Escolha a turma.</p>';return}
  if(!prazo){fb.innerHTML='<p class="erro-ia">Defina a data e o horário de entrega.</p>';return}
  const tNome=((window.__turmas||[]).find(t=>t.id===turmaId)||{}).nome||'a turma';
  if(!confirm('Publicar "'+p.nomePeca+'" para '+tNome+' com prazo '+dataHoraBR(prazo)+'? Os alunos da turma serão avisados por e-mail.'))return;
  fb.innerHTML='<p style="font-family:Arial,sans-serif;font-size:.85rem"><span class="spinner"></span>Publicando...</p>';
  try{const r=await apiPost('/api/peca/salvar',Object.assign({id,nomePeca:p.nomePeca,turmaId,caso:p.caso,gab:p.gab,prazo,publicar:true},classificacaoPayload(p)));
    const d=await r.json();
    if(!r.ok){fb.innerHTML='<p class="erro-ia">'+esc(d.erro||'Erro')+'</p>';return}
    abrirPeca(id);
  }catch(e){fb.innerHTML='<p class="erro-ia">Falha: '+esc(e.message)+'</p>';}
}

function notaBR(v){return v==null?'—':String(v).replace('.',',')}
function corAproveitamento(v){return v<60?'var(--vermelho)':(v<75?'#b7791f':'var(--verde)')}
async function carregarPainel(tid){
  const el=document.getElementById('painel_ped');if(!el)return;
  if(!tid){el.innerHTML='<div class="card"><p>Escolha uma turma.</p></div>';return}
  el.innerHTML='<p><span class="spinner"></span>Calculando indicadores...</p>';
  try{const r=await apiGet('/api/painel?turma='+encodeURIComponent(tid));const d=await r.json();
    if(!r.ok){el.innerHTML='<p class="erro-ia">'+esc(d.erro||'Erro')+'</p>';return}
    const z=d.resumo;
    let html='<div class="metricas">'
      +'<div class="metrica"><b>'+d.turma.alunos+'</b><span>alunos na turma</span></div>'
      +'<div class="metrica"><b>'+z.pecas+'</b><span>peças publicadas</span></div>'
      +'<div class="metrica"><b>'+z.entregas+'</b><span>entregas recebidas</span></div>'
      +'<div class="metrica"><b>'+z.pendentes+'</b><span>aguardando validação</span></div>'
      +'<div class="metrica"><b>'+notaBR(z.media)+'</b><span>média geral / 10</span></div></div>';
    let pt='<table><tr><th>Peça</th><th>Entrega</th><th>Corrigidas</th><th>Pendentes</th><th>Média</th><th>Faixa</th></tr>';
    for(const p of d.pecas)pt+='<tr><td><b>'+p.num+'. '+esc(p.nomePeca)+'</b></td><td><div class="barra-ind"><span style="width:'+Math.min(100,p.taxaEntrega)+'%"></span></div><small>'+p.entregas+'/'+p.alunos+' ('+notaBR(p.taxaEntrega)+'%)</small></td><td>'+p.corrigidas+'</td><td>'+p.pendentes+'</td><td><b>'+notaBR(p.media)+'</b></td><td>'+notaBR(p.menor)+' a '+notaBR(p.maior)+'</td></tr>';
    pt+='</table>';
    html+='<div class="card painel"><h3>Desempenho por peça</h3>'+(d.pecas.length?pt:'<p>Nenhuma peça publicada para esta turma.</p>')+'</div>';
    if(d.criterios.length){let ct='<table><tr><th>Critério</th><th>Aproveitamento</th><th>Correções analisadas</th></tr>';
      for(const c of d.criterios)ct+='<tr><td>'+esc(c.nome)+'</td><td><div class="barra-ind"><span style="width:'+Math.min(100,c.aproveitamento)+'%;background:'+corAproveitamento(c.aproveitamento)+'"></span></div><b>'+notaBR(c.aproveitamento)+'%</b></td><td>'+c.avaliacoes+'</td></tr>';
      ct+='</table>';html+='<div class="card painel"><h3>Aproveitamento por critério</h3><p style="font-size:.84rem;color:var(--cinza);font-family:Arial,sans-serif">Ordenado do critério que mais precisa de atenção para o mais forte.</p>'+ct+'</div>';}
    let at='<table><tr><th>Aluno</th><th>Entregas</th><th>Corrigidas</th><th>Média</th><th>Evolução</th></tr>';
    for(const a of d.alunos){const ev=a.evolucao==null?'—':((a.evolucao>0?'+':'')+notaBR(a.evolucao));at+='<tr><td><b>'+esc(a.nome||'—')+'</b><br><small>'+esc(a.matricula)+'</small></td><td>'+a.entregas+'/'+z.pecas+'</td><td>'+a.corrigidas+'</td><td>'+notaBR(a.media)+'</td><td style="color:'+(a.evolucao>0?'var(--verde)':(a.evolucao<0?'var(--vermelho)':'var(--cinza)'))+'">'+ev+'</td></tr>';}
    at+='</table>';html+='<div class="card painel"><h3>Acompanhamento dos alunos</h3><p style="font-size:.84rem;color:var(--cinza);font-family:Arial,sans-serif">Evolução = diferença entre a primeira e a última nota validada.</p>'+(d.alunos.length?at:'<p>Nenhum aluno cadastrado.</p>')+'</div>';
    el.innerHTML=html;
  }catch(e){el.innerHTML='<p class="erro-ia">Falha ao carregar o painel.</p>'}
}
async function baixarPlanilha(){
  const tid=(document.getElementById('nt_turma')||{}).value;

  if(!tid){fb.innerHTML='<p class="erro-ia">Escolha a turma.</p>';return}
  try{const r=await apiGet('/api/notas.csv?turma='+encodeURIComponent(tid));
    if(!r.ok){fb.innerHTML='<p class="erro-ia">'+esc(await r.text())+'</p>';return}
    const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);

  }catch(e){alert('Falha ao baixar.')}
}

      if(p.login===d.meuLogin) acoes='<span style="color:var(--dourado)">você</span>';

async function salvarProfessor(){
  const login=document.getElementById('pr_login').value.trim();
  const nome=document.getElementById('pr_nome').value.trim();
  const papel=document.getElementById('pr_papel').value;
  const fb=document.getElementById('pr_fb');
  if(!login){fb.innerHTML='<p class="erro-ia">Informe o login.</p>';return}
  const r=await apiPost('/api/professores/salvar',{login,nome,papel});const d=await r.json();
  if(!r.ok){fb.innerHTML='<p class="erro-ia">'+esc(d.erro||'Erro')+'</p>';return}
  if(d.novo)alert('Cadastrado(a)!\n\nLogin: '+login+'\nSenha temporária: '+d.senhaInicial+'\n\nCopie agora: ela não será exibida novamente.');
  profProfessores();
}
async function excluirProfessor(login){
  if(!confirm('Remover '+login+' do sistema? As peças criadas por essa pessoa continuam no banco.'))return;
  const r=await apiPost('/api/professores/excluir',{login});const d=await r.json();
  if(!r.ok){alert(d.erro||'Erro');return}
  profProfessores();
}
async function resetProfessor(login){
  if(!confirm('Resetar a senha de '+login+' para o próprio login? A pessoa troca no próximo acesso.'))return;
  const r=await apiPost('/api/professores/reset',{login});const d=await r.json();
  if(!r.ok){alert(d.erro||'Erro');return}
  mostrarSenhaTemporaria('Senha temporária de '+login,d.senhaTemporaria);
  profProfessores();
}

async function carregarTurmasAtuacao(){
  try{
    const r=await apiGet('/api/turmas');const d=await r.json();
    if(r.ok){
      TURMAS_ATUACAO=d.turmas||[];
      if(!TURMAS_ATUACAO.some(t=>t.id===TURMA_ATUACAO)){
        TURMA_ATUACAO=TURMAS_ATUACAO.length?TURMAS_ATUACAO[0].id:'';
        sset('turma_atuacao',TURMA_ATUACAO);
      }
    }
  }catch(e){TURMAS_ATUACAO=[];}
}
function seletorTurmaAtuacao(){
  if(!professorEmVisaoAluno())return '';
  const opts=TURMAS_ATUACAO.map(t=>'<option value="'+esc(t.id)+'" '+(t.id===TURMA_ATUACAO?'selected':'')+'>'+esc(t.nome)+'</option>').join('');
  return '<div class="grupo">Turma da visão aluno</div>'
   +'<div style="margin:2px 12px 14px"><select onchange="trocarTurmaAtuacao(this.value)" style="width:100%;padding:8px;border-radius:6px;border:1px solid #3a5478;background:#fff;color:#20304a;font-family:Arial,sans-serif">'+opts+'</select></div>';
}
function trocarTurmaAtuacao(id){if(!TURMAS_ATUACAO.some(t=>t.id===id))return;TURMA_ATUACAO=id;sset('turma_atuacao',id);telaAluno();}

   +'<div class="card" style="border:1px solid #e6b4b0;background:#fbeceb">'
   +'<h3 style="color:var(--vermelho)">⚠️ Atenção: esta ação é irreversível</h3>'
   +'<p style="font-family:Arial,sans-serif;font-size:.92rem;margin-bottom:6px">Ao se descadastrar:</p>'
   +'<ul style="font-family:Arial,sans-serif;font-size:.92rem;margin:0 0 14px 20px;line-height:1.75">'
   +'<li>você <b>sai da turma</b> e seu nome é apagado da lista do(a) professor(a);</li>'
   +'<li>você <b>perde o acesso ao sistema</b> — não conseguirá mais entrar com a sua matrícula;</li>'
   +'<li>você perde o acesso às <b>peças enviadas</b> e às <b>correções</b> já recebidas;</li>'
   +'<li>para <b>voltar à turma</b>, será preciso pedir ao(à) professor(a) que cadastre a sua matrícula novamente.</li>'
   +'</ul>'
   +'<div style="background:#fff;border:1px solid #e3ded2;border-radius:8px;padding:12px 14px;margin-bottom:16px">'
   +'<p style="font-family:Arial,sans-serif;font-size:.9rem;margin:0;color:var(--cinza)">Só quer fechar a sessão neste computador? Use <b>Sair</b> — você continua na turma e pode entrar de novo depois.</p>'
   +'</div>'
   +'<p style="font-family:Arial,sans-serif;font-size:.9rem;margin-bottom:6px">Para confirmar, digite <b>DESCADASTRAR</b> abaixo:</p>'
   +'<input id="dc_conf" placeholder="DESCADASTRAR" style="padding:9px;border:1px solid #cfc9b8;border-radius:6px;font-family:Arial,sans-serif;width:230px">'
   +'<div class="botoes" style="margin-top:16px">'
   +'<button onclick="telaAluno()">← Cancelar e voltar</button>'
   +'<button style="background:var(--vermelho);color:#fff;border:none" onclick="confirmarDescadastro()">Confirmar descadastro</button>'
   +'</div><div id="dc_fb"></div></div>';
}
async function confirmarDescadastro(){
  const fb=document.getElementById('dc_fb');
  const v=((document.getElementById('dc_conf')||{}).value||'').trim().toUpperCase();
  if(v!=='DESCADASTRAR'){fb.innerHTML='<p class="erro-ia">Digite DESCADASTRAR para confirmar.</p>';return}
  fb.innerHTML='<p style="font-family:Arial,sans-serif;font-size:.88rem"><span class="spinner"></span>Processando...</p>';
  try{const r=await apiPost('/api/descadastrar',{});const d=await r.json();
    if(!r.ok){fb.innerHTML='<p class="erro-ia">'+esc(d.erro||'Não foi possível concluir o descadastro.')+'</p>';return}
    sair('Você foi descadastrado(a) da turma e não tem mais acesso ao sistema.');
  }catch(e){fb.innerHTML='<p class="erro-ia">Falha de conexão. Tente novamente.</p>';}
}
function abrirPecaAluno(id){
  const p=(window.__pecasAluno||[]).find(x=>x.id===id);if(!p)return;
  const rasc=sget('peca_'+id,'');
  try{window.__arquivoAluno=JSON.parse(sget('arquivo_'+id,'null'))}catch(e){window.__arquivoAluno=null}
  const fechado=!p.enviado&&!p.noPrazo;
  conteudo.innerHTML='<div class="botoes" style="margin-bottom:10px"><button onclick="telaAluno()">← Voltar</button></div>'
   +'<span class="badge">Peça '+p.num+' · '+esc(p.disc)+'</span><h2 class="titulo-peca">'+esc(p.nomePeca)+'</h2>'
   +'<p style="font-family:Arial,sans-serif;font-size:.85rem;color:'+(fechado?'var(--vermelho)':'var(--cinza)')+'">Prazo: '+(p.prazo?dataHoraBR(p.prazo):'sem prazo')+(fechado?' — PRAZO ENCERRADO':'')+'</p>'
   +classificacaoHtml(p.classificacao)
   +'<div class="card"><h3>Enunciado</h3><div class="caso">'+esc(p.caso)+'</div></div>'
   +((p.gabLiberado&&p.gab)?'<div class="card"><h3>📖 Gabarito oficial</h3><p style="font-size:.82rem;color:var(--cinza);font-family:Arial,sans-serif">Liberado após o encerramento do prazo. Compare com a sua peça e confira as fontes pelos links.</p><div class="bloco" style="background:#eef5ee;border:1px solid #cfe3cf;border-radius:8px;padding:14px">'+linkCitacoesHtml(md2html(p.gab))+'</div></div>':'')
   +(fechado?'<div class="card"><p class="erro-ia">O prazo desta peça já encerrou. Não é possível enviar. Se precisar, fale com o(a) professor(a) para renovar o prazo ou liberar sua entrega.</p></div>'
     :('<div class="card"><h3>Sua peça</h3><p style="font-size:.85rem;color:var(--cinza)">Você pode escrever aqui ou enviar um arquivo pronto. Em qualquer opção, confira o texto antes de entregar. Se citar jurisprudência, inclua no final as fontes e os links.</p>'
   +'<div class="envio-opcoes">'
   +'<label class="envio-opcao"><span style="font-size:1.5rem">📄</span><span><b>Enviar PDF ou Word</b><small>PDF, DOCX ou DOC · até 6 MB</small></span><input type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="display:none" onchange="subirArquivoAluno(this,\''+id+'\')"></label>'
   +'<label class="envio-opcao"><span style="font-size:1.5rem">📷</span><span><b>Transcrever fotos</b><small>Até 6 páginas manuscritas, na ordem</small></span><input type="file" accept="image/*" multiple style="display:none" onchange="transcreverFotos(this,\''+id+'\')"></label>'
   +'</div><div id="al_import">'+(window.__arquivoAluno?'<p style="color:var(--verde);font: .82rem Arial,sans-serif">📎 Arquivo importado: <b>'+esc(window.__arquivoAluno.nome)+'</b></p>':'')+'</div><div id="al_ocr"></div>'
   +'<textarea id="al_texto" class="redacao" placeholder="EXCELENTÍSSIMO SENHOR...">'+esc(rasc)+'</textarea>'
   +'<div class="botoes"><button onclick="salvarRascunhoAluno(\''+id+'\')">💾 Salvar rascunho</button>'
   +'<button class="primario" onclick="pedirParecerInicial(\''+id+'\')">🔎 Receber parecer inicial e decidir</button></div>'
   +'<p class="aviso" style="margin-top:10px"><b>Antes do envio:</b> o parecer aponta referências duvidosas, sinais de IA/prompts e riscos graves. Depois, você escolhe entre enviar para correção ou refazer a peça. Nada é enviado sem a sua confirmação.</p>'
   +(p.enviado?'<p class="aviso">Você já enviou esta peça. Reenviar substitui a anterior e cancela a correção pendente.</p>':'')
   +'<div id="al_fb"></div><div id="al_parecer"></div></div>'));
  window.__textoParecerInicial=null;
  const t=document.getElementById('al_texto');if(t)t.addEventListener('input',()=>{sset('peca_'+id,t.value);if(window.__textoParecerInicial!==null&&t.value.trim()!==window.__textoParecerInicial){window.__textoParecerInicial=null;const pr=document.getElementById('al_parecer');if(pr)pr.innerHTML='<div class="parecer-inicial"><p><b>Você alterou a peça.</b> A versão anterior não será enviada. Quando terminar, peça um novo parecer inicial.</p></div>'}});
}
function salvarRascunhoAluno(id){sset('peca_'+id,document.getElementById('al_texto').value);document.getElementById('al_fb').innerHTML='<p style="color:var(--verde);font-family:Arial,sans-serif;font-size:.85rem">Rascunho salvo.</p>';}
function arquivoParaDataUrl(file){return new Promise((ok,err)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=()=>err(new Error('Não foi possível ler o arquivo.'));fr.readAsDataURL(file)})}
async function subirArquivoAluno(inp,id){
  const f=(inp.files||[])[0];inp.value='';if(!f)return;
  const fb=document.getElementById('al_import'),t=document.getElementById('al_texto');
  if(f.size>6*1024*1024){fb.innerHTML='<p class="erro-ia">O arquivo ultrapassa 6 MB. Salve uma versão menor e tente novamente.</p>';return}
  if(t.value.trim()&&!confirm('Importar este arquivo substituirá o texto que está no editor. Continuar?'))return;
  fb.innerHTML='<p style="font: .85rem Arial,sans-serif"><span class="spinner"></span>Lendo '+esc(f.name)+' com segurança...</p>';
  try{
    const arquivo=await arquivoParaDataUrl(f);
    const r=await apiPost('/api/aluno/extrair-arquivo',{nome:f.name,arquivo});const d=await r.json();
    if(!r.ok){fb.innerHTML='<p class="erro-ia">'+esc(d.erro||'Não foi possível ler o arquivo.')+'</p>';return}
    t.value=d.texto;sset('peca_'+id,t.value);window.__arquivoAluno=d.arquivo;sset('arquivo_'+id,JSON.stringify(d.arquivo));
    const avisos=(d.avisos||[]).map(a=>'<li>'+esc(a)+'</li>').join('');
    fb.innerHTML='<p style="color:var(--verde);font: .85rem Arial,sans-serif">✅ <b>'+esc(d.arquivo.nome)+'</b> importado. Confira especialmente nomes, números e o final do documento antes de enviar.</p>'+(avisos?'<ul class="erro-ia" style="margin-left:20px">'+avisos+'</ul>':'');
    t.scrollIntoView({behavior:'smooth',block:'center'});t.focus();
  }catch(e){fb.innerHTML='<p class="erro-ia">Falha ao importar: '+esc(e.message)+'</p>'}
}
const ETAPAS_PARECER=[[0,'📖 Lendo sua peça com cuidado...'],[18,'🔎 Conferindo citações em fontes oficiais...'],[55,'🧭 Procurando riscos jurídicos e processuais...'],[78,'🛡️ Verificando sinais de prompt ou conteúdo de IA...']];
async function pedirParecerInicial(id){
  const texto=document.getElementById('al_texto').value.trim();const fb=document.getElementById('al_parecer');
  if(texto.length<80){fb.innerHTML='<p class="erro-ia">Escreva ou importe a peça antes de pedir o parecer.</p>';return}
  const prog=progresso(fb,ETAPAS_PARECER,110);
  try{
    const r=await apiPost('/api/aluno/parecer-inicial',{id,texto});const d=await r.json();prog.fim();
    if(!r.ok){let m=d.erro||'Não foi possível preparar o parecer agora.';if(m==='LIMITE_CREDITOS')m='O recurso de análise atingiu o limite temporário.';fb.innerHTML='<div class="parecer-inicial"><p class="erro-ia">'+esc(m)+'</p><p class="aviso">Sua peça continua salva. Para não perder o prazo, você pode tentar novamente ou enviá-la sem o parecer.</p><div class="botoes"><button onclick="pedirParecerInicial(\''+id+'\')">Tentar novamente</button><button class="primario" onclick="enviarPeca(\''+id+'\',true)">Enviar sem parecer</button></div></div>';return}
    const sinais=(d.sinaisPrompt||[]).length?'<div class="erro-ia"><b>Alerta técnico:</b> o arquivo contém possível '+esc(d.sinaisPrompt.join(', '))+'. Revise e remova qualquer instrução que não faça parte da peça.</div>':'';
    const rob=d.robotizacao&&d.robotizacao.nivel!=='baixo'?'<div class="aviso" style="color:#8a5a00"><b>Indícios de robotização para revisar:</b> '+esc((d.robotizacao.sinais||[]).join('; '))+'. Padrões formais não provam autoria por IA; servem para você conferir se o texto realmente tem sua voz e sua supervisão.</div>':'';
    window.__textoParecerInicial=texto;
    fb.innerHTML='<div class="parecer-inicial"><p style="font: .78rem Arial,sans-serif;color:var(--cinza);margin-bottom:10px">Triagem pedagógica automática · a decisão final é do professor</p>'+linkCitacoesHtml(md2html(d.parecer))+sinais+rob+'<div style="border-top:1px solid #cdd8e6;margin-top:16px;padding-top:14px"><h3>O que você quer fazer agora?</h3><p style="font: .84rem Arial,sans-serif;color:var(--cinza)">A peça só será enviada se você escolher a primeira opção.</p><div class="botoes"><button class="primario" onclick="enviarPeca(\''+id+'\')">📨 Enviar esta versão para correção</button><button onclick="refazerPecaAluno(\''+id+'\')">✏️ Refazer a peça — não enviar</button></div></div></div>';
  }catch(e){prog.fim();fb.innerHTML='<div class="parecer-inicial"><p class="erro-ia">Falha de conexão. Sua peça continua salva.</p><div class="botoes"><button onclick="pedirParecerInicial(\''+id+'\')">Tentar novamente</button><button class="primario" onclick="enviarPeca(\''+id+'\',true)">Enviar sem parecer</button></div></div>'}
}
function refazerPecaAluno(id){
  window.__textoParecerInicial=null;
  const fb=document.getElementById('al_parecer'),t=document.getElementById('al_texto');
  fb.innerHTML='<div class="parecer-inicial"><p><b>Nada foi enviado.</b> Revise a peça no editor. Quando terminar, solicite um novo parecer para decidir novamente.</p></div>';
  sset('peca_'+id,t.value);t.focus();t.scrollIntoView({behavior:'smooth',block:'center'});
}
// Reduz a foto no navegador (fotos de celular são grandes demais para enviar inteiras)
function redimensionarFoto(file){return new Promise((ok,err)=>{const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{try{const esc2=Math.min(1,1800/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*esc2);c.height=Math.round(img.height*esc2);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',0.85));}catch(e){err(e)}};
  img.onerror=()=>{URL.revokeObjectURL(url);err(new Error('imagem inválida'))};img.src=url;})}
async function transcreverFotos(inp,id){
  const files=Array.from(inp.files||[]).slice(0,6);inp.value='';if(!files.length)return;
  const fb=document.getElementById('al_ocr');
  fb.innerHTML='<p style="font-family:Arial,sans-serif;font-size:.85rem"><span class="spinner"></span>Preparando '+files.length+' foto(s) e transcrevendo com IA... (pode levar até 1 minuto)</p>';
  try{
    const imagens=[];for(const f of files)imagens.push(await redimensionarFoto(f));
    const r=await apiPost('/api/aluno/transcrever',{imagens});const d=await r.json();
    if(!r.ok){let m=d.erro||'Erro';if(m==='LIMITE_CREDITOS')m='⛔ Limite mensal de uso da IA atingido. Avise o professor.';fb.innerHTML='<p class="erro-ia">'+esc(m)+'</p>';return}
    const t=document.getElementById('al_texto');
    t.value=(t.value.trim()?t.value.trim()+'\n\n':'')+d.texto;
    sset('peca_'+id,t.value);
    fb.innerHTML='<p style="color:var(--verde);font-family:Arial,sans-serif;font-size:.85rem">✅ Transcrição pronta! <b>Confira o texto abaixo e corrija o que precisar</b> — trechos que a IA não conseguiu ler estão marcados como [ilegível]. Só envie depois de revisar.</p>';
    t.scrollIntoView({behavior:'smooth',block:'center'});
  }catch(e){fb.innerHTML='<p class="erro-ia">Falha ao processar as fotos: '+esc(e.message)+'</p>';}
}
async function enviarPeca(id,semParecer){
  const texto=document.getElementById('al_texto').value.trim();const fb=document.getElementById('al_fb');
  if(texto.length<80){fb.innerHTML='<p class="erro-ia">Escreva sua peça antes de enviar.</p>';return}
  if(!semParecer&&window.__textoParecerInicial!==texto){fb.innerHTML='<p class="erro-ia">A peça foi alterada depois do parecer. Solicite um novo parecer inicial antes de decidir o envio.</p>';return}
  if(!confirm('Enviar sua peça ao professor? Após o prazo pode não ser possível reenviar.'))return;
  try{const r=await apiPost('/api/entregar',{id,texto,arquivo:window.__arquivoAluno||null});const d=await r.json();
  if(!r.ok){let m=(d.erro||'Erro');if(m==='PRAZO')m='⏰ O prazo desta peça encerrou ('+dataHoraBR(d.prazo)+'). Fale com o(a) professor(a) para renovar ou liberar sua entrega.';fb.innerHTML='<p class="erro-ia">'+esc(m)+'</p>';return}
  sset('peca_'+id,'');sset('arquivo_'+id,'');
  const p=(window.__pecasAluno||[]).find(x=>x.id===id);if(p)p.enviado=true;
  fb.innerHTML='<div style="background:#eef5ee;border:1px solid #cfe3cf;border-radius:8px;padding:12px 14px;margin-top:12px;color:var(--verde);font-family:Arial,sans-serif">📨 <b>Peça enviada com sucesso.</b> O professor foi avisado. Você receberá a revisão final por e-mail.<div class="botoes"><button onclick="telaAluno()">Voltar às minhas peças</button></div></div>';
  }catch(e){}
}
function verMinhaCorrecao(id){alert('A correção validada foi enviada ao seu e-mail cadastrado. Confira sua caixa de entrada (e o spam).');}

async function restaurarSessao(){
  if(!AUTH){renderLogin();return}
  const tokenLegado=AUTH.token||'';
  try{
    const h=tokenLegado?{authorization:'Bearer '+tokenLegado}:{};
    const r=await fetch('/api/sessao',{headers:h,credentials:'same-origin'});
    if(!r.ok){aset('');AUTH=null;renderLogin();return}
    const d=await r.json();
    AUTH={tipo:d.tipo,usuario:d.usuario,nome:d.nome||'',papel:d.papel||'',admin:!!d.admin,gereProf:!!d.gereProf,gereCoord:!!d.gereCoord,turmaAtiva:d.turmaAtiva,precisaTrocarSenha:d.precisaTrocarSenha,precisaCompletarCadastro:d.precisaCompletarCadastro,precisaAceitarPrivacidade:d.precisaAceitarPrivacidade,emailVerificado:d.emailVerificado,email:d.email||'',whatsapp:d.whatsapp||''};
    aset(JSON.stringify(AUTH));iniciar();
  }catch(e){renderLogin('Não foi possível validar a sessão. Tente novamente.');}
}
restaurarSessao();
</script>
